    <script type="application/ld+json" id="ld-faq">{"@context": "https://schema.org", "@type": "FAQPage", "@id": "https://neilsang0.github.io/#faq", "mainEntity": [{"@type": "Question", "name": "What are Neil Sangwaiya's primary empirical research specializations?", "acceptedAnswer": {"@type": "Answer", "text": "My empirical research targets the pricing dynamics of sovereign green debt and cross-border regulatory environmental tariffs. On SSRN, I have published primary econometric investigations into India's Sovereign Green Bonds (quantifying the 2.0 bps greenium and analyzing auction truncation mechanics) as well as the quantitative equity risk of the EU's Carbon Border Adjustment Mechanism (CBAM) on ADX and DFM benchmark indices."}}, {"@type": "Question", "name": "What technical infrastructure and data products has Neil developed?", "acceptedAnswer": {"@type": "Answer", "text": "I build and maintain production RAG and AI extraction tooling. Through Bindler (bindler.pages.dev), I build and sell source-cited Excel workbooks for sustainability disclosure, climate reporting and project finance, from CSRD and IFRS S2 to solar, wind and battery storage models, and I have authored seven data extraction tools on Apify that reconstruct reading order from raw PDF glyph coordinates, resolve irregular HTML tables, and ingest complex developer documentation. Additionally, I founded Solandor (solandor.co), a clean energy capital tracking platform powered by Cloudflare Workers and automated cron scrapers."}}, {"@type": "Question", "name": "What is Neil's background as a student athlete?", "acceptedAnswer": {"@type": "Answer", "text": "Standing 6′6″, I have competed at elite levels in basketball since 2018. I served as team captain for Dubai Tribe (U16 and U19 divisions), played for Al Nasr Club, and currently compete for RIT Dubai. My athletic development includes international tournaments across Europe and the GCC, as well as high-intensity training at Combine Academy in North Carolina, USA."}}, {"@type": "Question", "name": "How does Neil bridge finance theory with the tools behind it?", "acceptedAnswer": {"@type": "Answer", "text": "Instead of relying on aggregated commercial datasets with opaque methodology, I engineer custom extraction harnesses that scrape, parse, and structure primary source government and corporate filings (DEA reports, reserve bank auction notices, EU CBAM annexes). This end-to-end provenance guarantees complete methodological transparency and reproducible statistical findings."}}]}</script>
